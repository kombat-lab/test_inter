[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "test-inter-bot"
version = "0.1.0"
description = "Telegram game bot built with aiogram"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "aiogram==3.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4,<10",
    "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
include = ["bot*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001"] # The bot intentionally contains Russian user-facing text.
